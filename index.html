<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRA Pediatric Rx & PALS Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; }
        .warning { background-color: #fff3cd; color: #856404; padding: 12px; border-radius: 6px; font-size: 0.85em; text-align: center; margin-bottom: 25px; border: 1px solid #ffeeba; line-height: 1.4; }
        .input-group { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e9ecef; margin-bottom: 15px; position: relative; }
        .search-group { background: #eef2f5; border-color: #d1d8dd; z-index: 10; }
        label { font-weight: bold; display: block; margin-top: 10px; margin-bottom: 8px; color: #34495e; }
        input[type="number"], input[type="text"], select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #bdc3c7; font-size: 16px; margin-bottom: 10px; background-color: #fff; box-sizing: border-box; transition: all 0.3s; }
        input[type="number"]:focus, input[type="text"]:focus, select:focus { outline: none; border-color: #3498db; box-shadow: 0 0 8px rgba(52, 152, 219, 0.4); }
        
        /* Autocomplete Dropdown Styles */
        .autocomplete-items { position: absolute; border: 1px solid #bdc3c7; border-top: none; z-index: 99; top: 100%; left: 15px; right: 15px; max-height: 250px; overflow-y: auto; background-color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border-radius: 0 0 6px 6px; }
        .autocomplete-items div { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #ecf0f1; font-size: 15px; }
        .autocomplete-items div:hover { background-color: #3498db; color: white; }
        .autocomplete-items div:last-child { border-bottom: none; }
        
        #result-box { margin-top: 25px; padding: 20px; border-left: 5px solid #27ae60; background-color: #eafaf1; display: none; border-radius: 0 8px 8px 0; position: relative; }
        .rx-title { font-weight: bold; color: #27ae60; margin-bottom: 12px; display: block; text-transform: uppercase; font-size: 0.9em; letter-spacing: 1px; }
        .rx-content { font-family: 'Courier New', Courier, monospace; font-size: 1.2em; line-height: 1.6; color: #2c3e50; font-weight: bold; background: #fff; padding: 15px; border-radius: 6px; border: 1px dashed #27ae60; }
        .rx-note { font-family: 'Segoe UI', sans-serif; font-size: 0.9em; color: #7f8c8d; margin-top: 12px; font-weight: normal; background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #ecf0f1; }
        .highlight { color: #e74c3c; font-weight: bold; background: #fadbd8; padding: 2px 6px; border-radius: 4px; }
        .copy-btn { position: absolute; top: 20px; right: 20px; background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 0.9em; font-weight: bold; transition: background 0.3s; }
        .copy-btn:hover { background: #219150; }
        .or-divider { text-align: center; font-weight: bold; color: #95a5a6; margin: 15px 0; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container">
    <h2>CRA Pediatric Rx & PALS Calculator</h2>
    <div class="warning">
        <strong>Disclaimer:</strong> Educational tool only. Hard max-caps are implemented, but always independently verify limits, contraindications, and dilutions before prescribing.
    </div>

    <div class="input-group">
        <label for="weight">⚖️ Patient Weight (kg)</label>
        <input type="number" id="weight" placeholder="Enter weight in kg (e.g., 14.5)" step="0.1" min="0" oninput="recalculateCurrent()">
    </div>

    <div class="input-group search-group">
        <label for="search">🔍 Quick Search</label>
        <input type="text" id="search" placeholder="Start typing a drug name (e.g., Amox, Epi)..." oninput="handleSearch()" autocomplete="off">
        <div id="autocomplete-list" class="autocomplete-items"></div>
    </div>

    <div class="or-divider">— OR BROWSE BY CATEGORY —</div>

    <label for="category">1. Select Clinical Category</label>
    <select id="category" onchange="updateMedList()">
        <option value="">-- Choose Category --</option>
        <option value="neuro_pain">Analgesia, Sedation & Neurology</option>
        <option value="respiratory">Respiratory, Asthma & Allergy</option>
        <option value="gi">Gastrointestinal</option>
        <option value="antimicrobial">Antimicrobials (PO & IV)</option>
        <option value="cardio">Cardiovascular & Diuretics</option>
        <option value="emergency">Emergency, Resuscitation & PALS</option>
        <option value="fluids">IV Fluids, Electrolytes & Blood</option>
    </select>

    <label for="medication">2. Select Medication & Concentration</label>
    <select id="medication" onchange="showPrescription(this.value)" disabled>
        <option value="">-- Select Category First --</option>
    </select>

    <div id="result-box">
        <button class="copy-btn" onclick="copyToClipboard()" id="copyBtn">Copy Text</button>
        <span class="rx-title">Calculated Order:</span>
        <div id="prescription-text" class="rx-content"></div>
        <div id="prescription-note" class="rx-note"></div>
    </div>
</div>

        else if (wt <= 20) rate = 40 + ((wt - 10) * 2);

        return Math.min(rate, 120).toFixed(1);

            { name: "Maintenance Fluid (D5 1/2 NS)", rx: "D5 0.45% NaCl IV Rate at {dose} ml/hr", note: "4-2-1 Rule. Max 120 ml/hr.", calc: w => calcMaintenance(w) },
            { name: "Maintenance Fluid (D5 NS)", rx: "D5 0.9% NaCl IV Rate at {dose} ml/hr", note: "4-2-1 Rule. Max 120 ml/hr.", calc: w => calcMaintenance(w) },
            { name: "Potassium Chloride (KCl)", rx: "KCl {dose} mEq added to fluids", note: "2 mEq/kg/day. Max 40 mEq/L peripherally.", calc: w => Math.min((w * 2), 40).toFixed(1) }
        ]
    };

    let allMedsList = [];
    let currentSelectedValue = ""; // Keeps track of what is currently displaying

    // Flatten database for search
    function initSearchList() {
        allMedsList = [];
        for (const cat in medData) {
            medData[cat].forEach((med, idx) => {
                allMedsList.push({ catId: cat, medIdx: idx, ...med });
            });
        }
    }
    initSearchList();

    // The Autocomplete Logic
    function handleSearch() {
        const rawQuery = document.getElementById("search").value.toLowerCase().trim();
        const searchTerms = rawQuery.split(" ");
        const listContainer = document.getElementById("autocomplete-list");
        
        listContainer.innerHTML = ""; // clear list
        
        if (rawQuery.length < 1) return;

        const filtered = allMedsList.filter(m => {
            const medName = m.name.toLowerCase();
            return searchTerms.every(term => medName.includes(term));
        });

        filtered.forEach(m => {
            const item = document.createElement("div");
            item.textContent = m.name;
            item.onclick = function() {
                // When clicked: fill search box, close list, calculate prescription
                document.getElementById("search").value = m.name;
                listContainer.innerHTML = "";
                
                // Keep the classic dropdowns synced visually
                document.getElementById("category").value = m.catId;
                updateMedList(false); // Update without erasing our choice
                document.getElementById("medication").value = `${m.catId}|${m.medIdx}`;
                
                // Show result
                showPrescription(`${m.catId}|${m.medIdx}`);
            };
            listContainer.appendChild(item);
        });
    }

    // Close autocomplete if clicking anywhere else
    document.addEventListener("click", function (e) {
        if (e.target.id !== "search") {
            document.getElementById("autocomplete-list").innerHTML = "";
        }
    });

    // The Classic Dropdown Logic
    function updateMedList(clearSearch = true) {
        if(clearSearch) document.getElementById("search").value = "";
        
        const catSelect = document.getElementById("category");
        const medSelect = document.getElementById("medication");
        const resultBox = document.getElementById("result-box");
        
        medSelect.innerHTML = '<option value="">-- Select Medication & Concentration --</option>';
        if(clearSearch) resultBox.style.display = "none";

        if (catSelect.value) {
            medSelect.disabled = false;
            medData[catSelect.value].forEach((item, index) => {
                let opt = document.createElement("option");
                opt.value = `${catSelect.value}|${index}`;
                opt.textContent = item.name;
                medSelect.appendChild(opt);
            });
        } else {
            medSelect.disabled = true;
        }
    }

    // Calculation Logic
    function showPrescription(selectedValue) {
        if(selectedValue && typeof selectedValue === "string") {
            currentSelectedValue = selectedValue;
        }
        
        const wtInput = parseFloat(document.getElementById("weight").value);
        const resultBox = document.getElementById("result-box");
        const rxText = document.getElementById("prescription-text");
        const rxNote = document.getElementById("prescription-note");
        const copyBtn = document.getElementById("copyBtn");

        copyBtn.innerText = "Copy Text";
        copyBtn.style.background = "#27ae60";

        if (currentSelectedValue) {
            const [catId, medIdx] = currentSelectedValue.split("|");
            const med = medData[catId][medIdx];
            let finalRx = med.rx;

            if (!isNaN(wtInput) && wtInput > 0) {
                const calculatedDose = med.calc(wtInput);
                finalRx = finalRx.replace('{dose}', `<span class="highlight">${calculatedDose}</span>`);
            } else {
                finalRx = finalRx.replace('{dose}', '____');
            }

            rxText.innerHTML = finalRx;
            rxNote.innerText = med.note;
            resultBox.style.display = "block";
        } else {
            resultBox.style.display = "none";
        }
    }
    
    // Updates live if weight is changed while a med is selected
    function recalculateCurrent() {
        if (currentSelectedValue) {
            showPrescription(currentSelectedValue);
        }
    }

    function copyToClipboard() {
        const textToCopy = document.getElementById("prescription-text").innerText;
        const copyBtn = document.getElementById("copyBtn");
        
        navigator.clipboard.writeText(textToCopy).then(() => {
            copyBtn.innerText = "Copied!";
            copyBtn.style.background = "#2c3e50";
        }).catch(err => {
            console.error('Failed to copy text: ', err);
            alert("Clipboard access denied. You can manually highlight and copy the text.");
        });
    }
</script>

</body>
</html>
